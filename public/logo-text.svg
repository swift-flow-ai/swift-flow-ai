<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon part (scaled down) -->
  <g transform="translate(10, 20) scale(0.6)">
    <circle cx="50" cy="20" r="8" fill="url(#logo-gradient)"/>
    <circle cx="50" cy="20" r="5" fill="white" opacity="0.3"/>
    
    <circle cx="30" cy="50" r="8" fill="url(#logo-gradient)"/>
    <circle cx="30" cy="50" r="5" fill="white" opacity="0.3"/>
    
    <circle cx="70" cy="50" r="8" fill="url(#logo-gradient)"/>
    <circle cx="70" cy="50" r="5" fill="white" opacity="0.3"/>
    
    <circle cx="50" cy="80" r="8" fill="url(#logo-gradient)"/>
    <circle cx="50" cy="80" r="5" fill="white" opacity="0.3"/>
    
    <line x1="50" y1="28" x2="50" y2="42" stroke="url(#logo-gradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="46" x2="34" y2="46" stroke="url(#logo-gradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="46" x2="66" y2="46" stroke="url(#logo-gradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="54" x2="46" y2="76" stroke="url(#logo-gradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="54" x2="54" y2="76" stroke="url(#logo-gradient)" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="50" cy="46" r="6" fill="url(#logo-gradient)"/>
    <circle cx="50" cy="46" r="3" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="90" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#logo-gradient)">
    Swift Flow
  </text>
  <text x="92" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b" letter-spacing="2">
    WORKFLOW AUTOMATION
  </text>
</svg>

