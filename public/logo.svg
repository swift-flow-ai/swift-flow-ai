<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="60" cy="60" r="54" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Lightning bolt / Zap icon representing workflow automation -->
  <path d="M 45 30 L 55 30 L 50 50 L 60 50 L 45 80 L 50 60 L 40 60 Z" 
        fill="white" 
        stroke="white" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>
  
  <!-- Abstract flow nodes (circles connected) -->
  <circle cx="75" cy="35" r="4" fill="white" opacity="0.8"/>
  <circle cx="75" cy="50" r="4" fill="white" opacity="0.8"/>
  <circle cx="75" cy="65" r="4" fill="white" opacity="0.8"/>
  <line x1="75" y1="39" x2="75" y2="46" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="75" y1="54" x2="75" y2="61" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>

